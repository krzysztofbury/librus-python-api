components:
  securitySchemes:
    ModernSessionCookies:
      type: apiKey
      in: header
      name: Cookie
      description: Server-selected cookies established by the exact modern handoff; kept in a separate per-account modern jar, never copied from native authentication.
    SessionCookie:
      type: apiKey
      in: cookie
      name: oauth_token
      description: Scope-preserving jar may also hold DZIENNIKSID, SDZIENNIKSID, and API DeviceCookie.
  parameters:
    NumericId:
      in: path
      name: id
      required: true
      schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[0-9]+$'}
    ClientId:
      in: query
      name: client_id
      required: true
      schema: {type: string, enum: ['46'], default: '46'}
  schemas:
    NumericIdentifier:
      oneOf:
        - {type: integer, minimum: 0}
        - {type: string, minLength: 1, maxLength: 64, pattern: '^[0-9]+$'}
    NumericReference:
      type: object
      required: [Id]
      properties:
        Id: {$ref: '#/components/schemas/NumericIdentifier'}
    Person:
      type: object
      required: [Id]
      properties:
        Id:
          oneOf:
            - {type: integer, minimum: 0}
            - {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
        FirstName: {type: string, nullable: true, maxLength: 256}
        LastName: {type: string, nullable: true, maxLength: 256}
  responses:
    Html:
      description: Raw bounded HTML, not normalized domain JSON
      content:
        text/html:
          schema: {type: string}
    Redirect:
      description: Validate origin, exact allowed path, hop count, cumulative bytes, and deadline before following
      headers:
        Location:
          schema: {type: string, maxLength: 4096}
    Failure:
      description: |
        401 session expiry; 403 scoped access denial; 429 throttle; 503 maintenance.
        No response excerpts in errors. Malformed required data is a parse failure,
        not empty success. Unknown/challenging authentication is unsupported.
