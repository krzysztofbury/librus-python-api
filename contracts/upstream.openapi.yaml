openapi: 3.0.3
info:
  title: Librus upstream integration contract
  version: 1.0.2
  license:
    name: MIT
  description: |
    Unofficial, independently authored, source-informed integration contract.
    Not an API supplied or guaranteed by Librus. Evidence combines original
    offline HTTP/parser verification and narrowly scoped authorized login,
    identity, and final-summary observations, not general account compatibility.
    Raw HTML is not a JSON domain record. Unknown login destinations are rejected
    rather than silently followed. Authentication can change last_login.
    Default requests target loopback; live requests require separate authorization.
servers:
  - url: http://localhost:8080
    description: Local fixture server; replace explicitly for authorized validation
paths:
  /wiadomosci3:
    get:
      operationId: modern_launch
      summary: Begin an explicit modern messaging authentication handoff
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Separately approved read-only discovery observed an exact modern MultiDomainLogon redirect. No auto-follow or send. See contracts/modern-messages.md.
      responses:
        '302': {$ref: '#/components/responses/Redirect'}
        default: {$ref: '#/components/responses/Failure'}
  /{namespace}/MultiDomainLogon/token/{token}/login/{login}/target/{target}/from/{source}:
    get:
      operationId: modern_handoff
      summary: One exact account-verified modern login handoff, with an isolated cookie jar
      security: []
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: One historical pobierz28 handoff set the modern session and redirected to /nowy. Later launch-only scopes observed pobierz12 and pobierz31 with matching fixed field facts. The owner approved a bounded numbered-family compatibility policy, not a claim every member exists. Login binds to the current credential context; no arbitrary redirects, guessed namespace, retry or fallback. See contracts/modern-launch-diagnostics.md.
      parameters:
        - {in: path, name: namespace, required: true, schema: {type: string, pattern: '^pobierz[0-9]{1,3}$'}, description: Server-selected numbered namespace; 1-3 ASCII digits is explicit library policy}
        - {in: path, name: token, required: true, schema: {type: string, pattern: '^[A-Za-z0-9]{32,256}$'}}
        - {in: path, name: login, required: true, schema: {type: string, minLength: 1, maxLength: 512}, description: Unpadded UTF-8 Base64 of the exact configured login}
        - {in: path, name: target, required: true, schema: {type: string, enum: [L25vd3k]}}
        - {in: path, name: source, required: true, schema: {type: string, enum: [c3luZXJnaWE]}}
      responses:
        '302': {$ref: '#/components/responses/Redirect'}
        default: {$ref: '#/components/responses/Failure'}
  /api/me:
    get:
      operationId: modern_identity
      security: [{ModernSessionCookies: []}]
      summary: Bind modern account identity to the independently verified native owner
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: One selected parent's modern account ID, name, group and origin matched native identity in separately approved discovery. A fresh shape-only scope observed accountId as a JSON integer whose decimal value matched the native owner; bounded non-negative integer normalization is identity-only library policy. No universal role/layout coverage. See contracts/modern-messages.md.
      responses:
        '200': {description: Modern account metadata with accountId normalized to a decimal string, content: {application/json: {schema: {type: object, required: [accountId, groupId, firstName, lastName, originSystem], properties: {accountId: {oneOf: [{type: string, pattern: '^[0-9]{1,64}$'}, {type: integer, minimum: 0, maximum: 9999999999999999999999999999999999999999999999999999999999999999}]}, groupId: {type: string, enum: ['5', '8', '9']}, firstName: {type: string}, lastName: {type: string}, originSystem: {type: string, enum: [synergia]}}}}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/receivers/types:
    get:
      operationId: modern_recipient_types
      security: [{ModernSessionCookies: []}]
      summary: Bounded modern type metadata, with unsupported branches explicit
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Populated type lists were independently observed. Allowlisted school, class and student/parent branches have lookup implementations; lookup support is not account availability or universal live qualification. Combined parents,guardians metadata is covered by original offline regression only. See contracts/modern-communication.md.
      parameters:
        - {in: query, name: includeClass, required: true, schema: {type: string, enum: ['true']}}
      responses:
        '200': {description: Typed modern directory metadata, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/receivers/groups/students-and-attendants:
    get:
      operationId: modern_recipients
      security: [{ModernSessionCookies: []}]
      summary: Explicit bounded council or student/parent selection preserving class, account and user IDs
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: One populated council/class layout independently checked with Chromium. Source-informed ordinary student/parent/guardian and virtual selections have original offline wire tests, not universal live availability. See contracts/modern-communication.md.
      parameters:
        - {in: query, name: receiverType, required: true, schema: {type: string, enum: [parentsCouncil, students, parents, guardians, 'parents,guardians', 'students,virtualStudents', 'parents,guardians,virtualParents,virtualGuardians']}}
      responses:
        '200':
          description: Class-qualified nested recipient leaves
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                oneOf:
                  - required: [classes]
                  - required: [data]
                properties:
                  classes: &ModernClassList
                    type: array
                    maxItems: 128
                    items:
                      type: object
                      required: [label, receivers]
                      additionalProperties: false
                      properties:
                        label: {type: string, minLength: 1, maxLength: 1024}
                        receivers:
                          type: array
                          minItems: 1
                          maxItems: 1
                          items:
                            type: array
                            maxItems: 2048
                            items:
                              type: object
                              required: [accountId, userId, name]
                              additionalProperties: false
                              properties:
                                accountId: {type: string, pattern: '^[0-9]{1,64}$'}
                                userId: {type: string, pattern: '^[0-9]{1,64}$'}
                                name: {type: string, minLength: 1, maxLength: 1024}
                  data: *ModernClassList
        default: {$ref: '#/components/responses/Failure'}
  /api/receivers/groups/school-employees:
    get:
      operationId: modern_school_recipients
      summary: Explicit allowlisted ordinary school employee directory branch
      security: [{ModernSessionCookies: []}]
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Closed candidate-source scopes observed teacher, tutor and school-admin leaves on one login. Other allowlisted employee selections remain source-informed and offline-qualified only. See release-evidence/0.5-communication-scopes.json and contracts/modern-communication.md.
      parameters:
        - {in: query, name: receiverType, required: true, schema: {type: string, enum: [schoolParentsCouncil, teachers, headteachers, pedagogue, admin, secretary, sadmin, tutors, librarian, otherSpecialist, careerAdvisor, speechTherapist, counsellor, specialCounsellor, psychologist, educationalTherapist, sensoryIntegrationTherapist, surdopedagogue, typhlopedagogue]}}
      responses:
        '200': {description: Bounded recipient branch JSON, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/receivers/groups/class-parents:
    get:
      operationId: modern_class_parents
      summary: Explicit class-parent branch with no arbitrary directory route
      security: [{ModernSessionCookies: []}]
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: source_informed
      x-evidence-note: Separately approved public app maps classParents to this route. Original offline wire tests; authenticated availability remains separately qualified. See contracts/modern-communication.md.
      parameters:
        - {in: query, name: receiverType, required: true, schema: {type: string, enum: [classParents]}}
      responses:
        '200': {description: Bounded class-parent JSON, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/inbox/messages:
    get:
      operationId: modern_messages_received
      summary: Ordinary modern inbox summaries without opening content
      security: [{ModernSessionCookies: []}]
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Closed candidate-source scopes observed populated inbox pages 1-2 and existing inboxes across four isolated logins. One-based page and bounded limit have original wire tests. No automatic fallback or body open. See release-evidence/0.5-communication-scopes.json and release-evidence/0.5-communication-expansion-scopes.json.
      parameters:
        - {in: query, name: page, required: true, schema: {type: integer, minimum: 1, maximum: 1000}}
        - {in: query, name: limit, required: true, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        '200': {description: Bounded summaries and total count, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/outbox/messages:
    get:
      operationId: modern_messages_sent
      summary: Ordinary modern sent summaries without opening content
      security: [{ModernSessionCookies: []}]
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Closed candidate-source scopes observed ordinary sent summaries, empty student outboxes and a populated second sent page at size five. Sent counts are not recipient acknowledgement. See release-evidence/0.5-communication-expansion-scopes.json and contracts/modern-communication.md.
      parameters:
        - {in: query, name: page, required: true, schema: {type: integer, minimum: 1, maximum: 1000}}
        - {in: query, name: limit, required: true, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        '200': {description: Bounded sent summaries and total count, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/inbox/messages/{id}:
    get:
      operationId: modern_content_received
      summary: Explicit received content open with potential mark-read effect
      security: [{ModernSessionCookies: []}]
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: mark_read
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Separately approved source API reads qualify ordinary plain content and one consented unread-to-read transition. XML/original/archive layouts have original bounded offline proofs, not universal live compatibility. See contracts/modern-communication.md.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[0-9]{1,64}$'}}
      responses:
        '200': {description: Bounded detail JSON with inert decoded body and attachment metadata, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/outbox/messages/{id}:
    get:
      operationId: modern_content_sent
      summary: Explicit sent content open with inert metadata
      security: [{ModernSessionCookies: []}]
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Approved source API reads qualify two ordinary XML-wrapped sent details and recipient read/null observations; delivery acknowledgements remain unknown. Expanded and CC/BCC rosters have source-informed offline tests only. See contracts/modern-communication.md.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[0-9]{1,64}$'}}
      responses:
        '200': {description: Bounded sent detail JSON, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/attachments/{file_id}/messages/{message_id}:
    get:
      operationId: modern_attachment_resolve
      summary: Explicit modern attachment resolution without opening message content
      security: [{ModernSessionCookies: []}]
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Approved inspection observed two data.downloadLink responses pointing to the exact official sandbox GetFile key shape. Original three-origin wire tests reject other destinations and preserve credential-free streaming. See contracts/modern-communication.md.
      parameters:
        - {in: path, name: file_id, required: true, schema: {type: string, pattern: '^[0-9]{1,64}$'}}
        - {in: path, name: message_id, required: true, schema: {type: string, pattern: '^[0-9]{1,64}$'}}
      responses:
        '200':
          description: Bounded resolver JSON; never follow redirects or return the signed URL to the caller
          content:
            application/json:
              schema: &ModernAttachmentResolution
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [downloadLink]
                    properties:
                      downloadLink: {type: string, minLength: 1, maxLength: 2048}
        default: {$ref: '#/components/responses/Failure'}
  /api/archive/attachments/{file_id}/messages/{message_id}:
    get:
      operationId: modern_archive_attachment_resolve
      summary: Explicit archive-qualified modern attachment resolution
      security: [{ModernSessionCookies: []}]
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: source_informed
      x-evidence-note: Approved public reader establishes the separate archive route. Original wire fixtures cover routing and destination guards; no archived live file was observed. See contracts/modern-communication.md.
      parameters:
        - {in: path, name: file_id, required: true, schema: {type: string, pattern: '^[0-9]{1,64}$'}}
        - {in: path, name: message_id, required: true, schema: {type: string, pattern: '^[0-9]{1,64}$'}}
      responses:
        '200': {description: Same bounded resolver envelope with credential-free signed destination policy, content: {application/json: {schema: *ModernAttachmentResolution}}}
        default: {$ref: '#/components/responses/Failure'}
  /api/messages:
    post:
      operationId: modern_send_message
      security: [{ModernSessionCookies: []}]
      summary: Single-attempt ordinary modern JSON message, never replayed or redirected
      description: Each send revalidates modern identity with one side-effect-free GET before POST; failure remains NOT_DISPATCHED. Complete bounded receipts survive return-time deadline expiry with separately bounded local parsing. No send retry or fallback.
      x-origin: messages
      x-upstream-origin: https://wiadomosci.librus.pl
      x-side-effect: send_message
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Public app assets informed serialization, qualified with original wire fixtures. One separately approved sole-recipient send returned HTTP 201 with exact data/messageId/status=sent envelope; the owner independently confirmed recipient and payload in the official sent UI. This qualifies upstream acceptance for that envelope, not recipient reading or all receipt variants. See contracts/modern-messages.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receivers, topic, content, storageId, category]
              properties:
                receivers:
                  type: object
                  additionalProperties: false
                  required: [schoolReceivers]
                  properties:
                    schoolReceivers:
                      type: array
                      minItems: 1
                      maxItems: 50
                      uniqueItems: true
                      items: {type: object, additionalProperties: false, required: [accountId], properties: {accountId: {type: string, pattern: '^[0-9]{1,64}$'}}}
                topic: {type: string, format: byte, description: 'Base64 of validated plain UTF-8 text, not HTML or inferred XML'}
                content: {type: string, format: byte, description: Base64 of HTML-escaped plain UTF-8 text with preserved line endings}
                storageId: {type: string, nullable: true, enum: [null]}
                category: {type: string, enum: [normal]}
      responses:
        '200': {description: No independently established positive acknowledgement; HTTP success alone remains UNKNOWN}
        '201':
          description: Only the exact observed JSON created/sent envelope establishes upstream ACCEPTED, not recipient reading
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [messageId, status]
                    properties:
                      messageId: {type: integer, minimum: 1, maximum: 9999999999999999999999999999999999999999999999999999999999999999}
                      status: {type: string, enum: [sent]}
        '400': {description: Only allowlisted explicit denial codes can establish REJECTED; other evidence remains UNKNOWN}
        '422': {description: Only allowlisted explicit denial codes can establish REJECTED; other evidence remains UNKNOWN}
        default: {description: 'UNKNOWN after potential dispatch, with no retry, fallback, redirects or post-send reauthentication'}
  /terminarz/dodane_od_ostatniego_logowania:
    get:
      operationId: consume_schedule_events
      tags: [Notifications]
      summary: Consume once with mandatory durable encoded-response handoff before decoding
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: consume_events
      x-retry-safe: false
      x-evidence: source_informed
      x-evidence-note: Source-informed read-once route and three-string event concept; conservative original four-column fixtures, not observed native live behavior. Never routine live verification.
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
  /wiadomosci/pobierz_zalacznik/{message_id}/{file_id}:
    get:
      operationId: attachment_resolve
      tags: [Attachments]
      summary: Resolve one account-bound attachment without replay or following redirects
      description: Unsupported signed route/key shapes fail without download or permission cooldown; foreign origin/scheme/userinfo violations remain denied. Exact native login redirects prove expiry.
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: source_informed
      x-evidence-note: Source-informed consumer two-hop legacy flow with original bounded HTTP proof. Installed 0.4.3 wheel observed one received-message 302 resolution; absence of read effects remains unqualified.
      parameters:
        - in: path
          name: message_id
          required: true
          schema: {type: string, pattern: '^[0-9]{1,64}$'}
        - in: path
          name: file_id
          required: true
          schema: {type: string, pattern: '^[0-9]{1,64}$'}
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
  /GetFile/{key}/get:
    get:
      operationId: attachment_download
      tags: [Attachments]
      summary: Credential-free bounded stream from the exact signed sandbox route
      security: []
      x-origin: download
      x-upstream-origin: https://sandbox.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: source_informed
      x-evidence-note: Separate no-cookie session and strict destination grammar exercised on original loopback fixtures. Installed 0.4.3 wheel streamed one 930056-byte received attachment with clean EOF and no declared length; broader signed key alphabet remains source-informed.
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string, minLength: 1, maxLength: 512, pattern: '^(?!\.{1,2}$)[A-Za-z0-9_.~-]+$'}
      responses:
        '200':
          description: Uninterpreted file bytes, identity encoding, no redirects; streamed under byte/deadline/request limits and an independent finite consumer-demand idle timeout
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default:
          $ref: '#/components/responses/Failure'
  /wiadomosci/1/5/{id}:
    get:
      operationId: message_content_received
      tags: [Messages]
      summary: Open one received message with explicit potential mark-read consent
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: mark_read
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized already-read received content and 0.4.3 populated attachment metadata independently checked. Original HTTP proof prohibits replay; richer received layouts remain pending.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[0-9]{1,64}$'}
      responses:
        '200':
          $ref: '#/components/responses/Html'
        default:
          $ref: '#/components/responses/Failure'
  /wiadomosci/1/6/{id}:
    get:
      operationId: message_content_sent
      tags: [Messages]
      summary: Open one sent message without automatic replay
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Two 0.4.5 sent opens on independent login contexts observed subject/date metadata without an Adresat field and separate individual read receipts. Original fixtures and Chromium check these exact bytes; richer and sent-attachment layouts remain pending.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[0-9]{1,64}$'}
      responses:
        '200':
          $ref: '#/components/responses/Html'
        default:
          $ref: '#/components/responses/Failure'
  /loguj/portalRodzina:
    get:
      operationId: login_portal
      tags: [Authentication]
      summary: Begin cookie-based portal login
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized bounded portal redirect observation and an original loopback fixture; account variants remain unqualified.
      responses:
        '302':
          description: Authorization redirect with account-scoped cookies
          headers:
            Location:
              schema: {type: string, maxLength: 4096}
        default:
          $ref: '#/components/responses/Failure'
  /OAuth/Authorization:
    get:
      operationId: login_authorization
      tags: [Authentication]
      summary: Establish API-side cookies from the portal redirect
      x-origin: api
      x-upstream-origin: https://api.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized form/cookie sequence observation and original cookie-scope fixtures; reuse the form reached through the portal instead of fetching it twice.
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - in: query
          name: response_type
          schema: {type: string, enum: [code]}
        - in: query
          name: scope
          schema: {type: string, enum: [mydata]}
        - in: query
          name: state
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
    post:
      operationId: login_submit
      tags: [Authentication]
      summary: Submit credentials once, without automatic retries
      x-origin: api
      x-upstream-origin: https://api.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized status/goTo observation with one credential submission per run; error/challenge conditions remain qualified offline only.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action, login, pass]
              properties:
                action: {type: string, enum: [login]}
                login: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
                pass: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
      responses:
        '200':
          description: JSON login result, or an unsupported interactive challenge
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok, error]}
                  goTo: {type: string, nullable: true, maxLength: 4096}
            text/html:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Failure'
  /OAuth/Authorization/2FA:
    get:
      operationId: login_continue
      tags: [Authentication]
      summary: Follow the non-interactive continuation when returned by goTo
      description: The route name is not proof of support for interactive 2FA or CAPTCHA.
      x-origin: api
      x-upstream-origin: https://api.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized non-interactive continuation observation; original redirect/challenge fixtures. No claim of interactive 2FA support.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
  /loguj:
    # Synthetic callback remains supported independently of the observed chain.
    get:
      operationId: login_callback
      tags: [Authentication]
      summary: Bounded allowlisted callback route
