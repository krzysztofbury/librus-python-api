openapi: 3.0.3
info:
  title: Librus upstream integration contract
  version: 0.3.0.dev0
  license:
    name: MIT
  description: |
    Unofficial, independently authored, source-informed integration contract.
    Not an API supplied or guaranteed by Librus. Evidence combines original
    offline HTTP/parser verification and narrowly scoped authorized login,
    identity, and final-summary observations, not general account compatibility.
    Raw HTML is not a JSON domain record. Unknown login destinations are rejected
    rather than silently followed. Authentication can change last_login.
    Default requests target loopback; live requests require separate authorization.
servers:
  - url: http://localhost:8080
    description: Local fixture server; replace explicitly for authorized validation
paths:
  /loguj/portalRodzina:
    get:
      operationId: login_portal
      tags: [Authentication]
      summary: Begin cookie-based portal login
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized bounded portal redirect observation and an original loopback fixture; account variants remain unqualified.
      responses:
        '302':
          description: Authorization redirect with account-scoped cookies
          headers:
            Location:
              schema: {type: string, maxLength: 4096}
        default:
          $ref: '#/components/responses/Failure'
  /OAuth/Authorization:
    get:
      operationId: login_authorization
      tags: [Authentication]
      summary: Establish API-side cookies from the portal redirect
      x-origin: api
      x-upstream-origin: https://api.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized form/cookie sequence observation and original cookie-scope fixtures; reuse the form reached through the portal instead of fetching it twice.
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - in: query
          name: response_type
          schema: {type: string, enum: [code]}
        - in: query
          name: scope
          schema: {type: string, enum: [mydata]}
        - in: query
          name: state
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
    post:
      operationId: login_submit
      tags: [Authentication]
      summary: Submit credentials once, without automatic retries
      x-origin: api
      x-upstream-origin: https://api.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized status/goTo observation with one credential submission per run; error/challenge conditions remain qualified offline only.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action, login, pass]
              properties:
                action: {type: string, enum: [login]}
                login: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
                pass: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
      responses:
        '200':
          description: JSON login result, or an unsupported interactive challenge
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok, error]}
                  goTo: {type: string, nullable: true, maxLength: 4096}
            text/html:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Failure'
  /OAuth/Authorization/2FA:
    get:
      operationId: login_continue
      tags: [Authentication]
      summary: Follow the non-interactive continuation when returned by goTo
      description: The route name is not proof of support for interactive 2FA or CAPTCHA.
      x-origin: api
      x-upstream-origin: https://api.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Authorized non-interactive continuation observation; original redirect/challenge fixtures. No claim of interactive 2FA support.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
  /loguj:
    # Synthetic callback remains supported independently of the observed chain.
    get:
      operationId: login_callback
      tags: [Authentication]
      summary: Bounded allowlisted callback route
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: synthetic_only
      x-evidence-note: Synthetic callback shape, not independently observed; actual account variants remain a live evidence gap.
      parameters:
        - in: query
          name: code
          schema: {type: string, maxLength: 512}
        - in: query
          name: state
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
  /OAuth/Authorization/PerformLogin:
    get:
      operationId: login_perform
      tags: [Authentication]
      summary: Follow the exact non-interactive login continuation route
      x-origin: api
      x-upstream-origin: https://api.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: |
        An authorized bounded observation established 2FA to PerformLogin to Grant
        redirects. Original loopback fixtures verify this chain. No credentials,
        cookies, account information, or response captures are included.
        Only follow when explicitly returned; do not bootstrap or retry this GET.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
  /OAuth/Authorization/Grant:
    get:
      operationId: login_grant
      tags: [Authentication]
      summary: Follow the exact consent grant returned during login
      x-origin: api
      x-upstream-origin: https://api.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: |
        Authorized bounded observation established Grant returning to the portal.
        The independently authored fixture uses a synthetic terminal callback.
        This is authentication state, not a retry-safe school read. Never follow
        arbitrary OAuth-prefix paths or submit interactive consent/2FA actions.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
  /:
    get:
      operationId: login_landing
      tags: [Authentication]
      summary: Optional landing response, never sufficient proof of login
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: synthetic_only
      x-evidence-note: Synthetic terminal route; cookie presence plus validated Me is required separately.
      responses:
        '200':
          $ref: '#/components/responses/Html'
        default:
          $ref: '#/components/responses/Failure'
  /uczen/index:
    get:
      operationId: login_student_landing
      tags: [Authentication]
      summary: Optional student landing if explicitly returned in the redirect chain
      description: Never bootstrap this route unconditionally or require it for parent access.
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: authentication
      x-retry-safe: false
      x-evidence: source_informed
      x-evidence-note: Source-informed student route; not a parent-account capability assumption. Offline verification only.
      responses:
        '200':
          $ref: '#/components/responses/Html'
        default:
          $ref: '#/components/responses/Failure'
  /gateway/api/2.0/Me:
    get:
      operationId: identity
      tags: [Identity]
      summary: Read login owner and represented student as distinct identities
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: true
      x-evidence: independently_observed
      description: |
        Account.Id identifies the login owner. The represented User.Id can be
        omitted when Account.UserId supplies its explicit reference. At least one
        represented-user ID is required; both, when present, must agree. Numeric
        IDs normalize to strings; booleans and unsupported IDs fail. Never infer
        the represented-user ID from Account.Id or names.
      x-evidence-note: |
        Source-informed Me/Account/User distinction; original malformed and
        parent/student fixtures. Bounded authorized observation established the
        Account.UserId reference variant with names-only User. Offline fixtures
        verify missing/conflicting references without storing any school values.
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Account denotes login owner; User denotes represented student
          content:
            application/json:
              schema:
                type: object
                required: [Me]
                properties:
                  Me:
                    type: object
                    required: [Account, User]
                    properties:
                      Account:
                        allOf:
                          - $ref: '#/components/schemas/Person'
                          - type: object
                            properties:
                              UserId:
                                oneOf:
                                  - {type: integer, minimum: 0}
                                  - {type: string, nullable: true, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
                                description: Numeric wire IDs are also normalized at the parser boundary
                      User:
                        type: object
                        properties:
                          Id:
                            oneOf:
                              - {type: integer, minimum: 0}
                              - {type: string, nullable: true, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
                          FirstName: {type: string, nullable: true, maxLength: 256}
                          LastName: {type: string, nullable: true, maxLength: 256}
        default:
          $ref: '#/components/responses/Failure'
  /przegladaj_oceny/uczen:
    get:
      operationId: final_grades
      tags: [Grades]
      summary: Read the school-provided midterm and annual grade summary
      description: |
        One GET fetches the summary without changing grade filters. Allows only
        observed stray closing-tag HTML repair and an empty full-width spacer.
        Requires a unique decorated/stretch table with a titled annual-grade
        header in thead. The semantic header omits body expander and subject
        cells; header colspans occupy body columns. Recognized titles are
        Ocena śródroczna z pierwszego okresu, Przewidywana ocena roczna, and
        Ocena roczna. BR suffixes in titles are ignored. Missing optional columns
        differ from available unassigned '-' or empty values. School-provided
        strings remain raw text, with no inferred grade/date/subject ID.
        Only Zachowanie permits body colspans. Unsupported rowspans, ambiguous
        summaries, malformed rows, duplicate subjects/tables, missing annual
        headers, and unrecognized empty pages fail explicitly.
        Bounds: 128 subjects, 64 expanded columns, 1024 characters/value, plus
        common transport/parser/request/byte/deadline limits. One expiry recovery
        is permitted under the original budget; other failures are not retried.
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: true
      x-evidence: independently_observed
      x-evidence-note: |
        Route research from librus-apix URL definitions and consumer summary
        requirements. Implementation and offline fixtures are original, not
        copied source or captures. Bounded authorized observations established
        stray closing tags and empty spacer rows; broader accounts unqualified.
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
        default:
          $ref: '#/components/responses/Failure'
    post:
      operationId: grades
      tags: [Grades]
      summary: Select a grade view and read the resulting HTML collection
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: select_view
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: |
        View-selection field is source-informed, not copied implementation.
        Authorized bounded GET and POST observations established dated tooltip
        metadata, weekday display suffixes, semester columns, and the all-view
        response. All/week/last-login form fields were independently exercised in
        bounded installed comparisons. Dated descriptive/publication layouts
        remain source-informed. Populated descriptive
        and average variants are not qualified by an empty live sample.
      description: |
        Changes the selected grade view, not school records. Send only the fixed
        view field. Never replay this POST automatically, including after
        session expiry, redirects, timeout, throttle, or ambiguous failure.
        Offline wire fixtures validate the form and non-replay contract only.
        Numeric tables require the final-summary alignment contract and two
        current-grade headers (Oceny bieżące) for displayed semesters 1 and 2.
        Inline grade-box anchors carry raw numeric/symbolic grades; direct
        linkless span.ocena markers carry descriptive grades with parent metadata.
        Tooltip Data is a civil ISO date, optionally with a standard abbreviated
        weekday suffix. Missing count/weight stays unknown, not false/zero.
        All, week, and last-login views are upstream filters, not local arithmetic
        over dates. Each view has its own account/session cache and in-flight key.
        Authentication changes last-login state; never infer the previous timestamp.
        Dated period/annual and predicted cells retain metadata and explicit kind.
        Descriptive-only rows use the scoped expander/subject/two-semester contract.
        Publication blocks preserve their date/teacher/paragraphs; absent semester
        stays unknown, not an invented first period. Multiple publications are kept.
        Plain undated descriptive semester text is a separate typed summary, not
        an invented dated grade. Numeric/descriptive subject families can overlap.
        School averages preserve text and explicit column availability; they are
        not computed. Expanded detail mirrors are not counted twice. Unknown
        current markup, malformed/duplicate metadata, invalid dates, and unsupported
        layouts fail instead of producing partial output.
        Limits: 2048 entries, 8192 tooltip/href characters, 32 tooltip fields, plus
        common subject/column/value/tree/transport/parser/operation bounds.
        Date-window filtering uses the same complete supported collection and
        creates no extra upstream operation or per-window cache.
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              oneOf:
                - required: [zmiany_logowanie_wszystkie]
                - required: [zmiany_logowanie_tydzien]
                - required: [zmiany_logowanie]
              properties:
                zmiany_logowanie_wszystkie: {type: string, enum: ['1']}
                zmiany_logowanie_tydzien: {type: string, enum: ['1']}
                zmiany_logowanie: {type: string, enum: ['1']}
      responses:
        '200':
          $ref: '#/components/responses/Html'
        default:
          $ref: '#/components/responses/Failure'
  /przegladaj_nb/uczen:
    post:
      operationId: attendance
      tags: [Attendance]
      summary: Select an attendance view and read the HTML collection
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: select_view
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: |
        Route, view fields, tooltip labels, grid/section concepts and detail-link
        requirements reviewed against installed librus-apix 1.5.3 and the existing
        consumer contracts. No implementation, fixture or capture was copied.
        Original semantic section-label fixtures are synthetic. Bounded installed
        validation observed all/week/last-login forms and the numeric Okres 1 label
        on one context. Last-login was empty; broader roles/layouts and populated
        second-semester qualification remain pending. See VERIFICATION.md.
      description: |
        Changes the upstream selected view, not attendance records. Never replay
        this POST automatically, including after expiry or ambiguous failure.
        All-view uses an empty field value; week/last-login values equal their
        field names. These differ from the grade-view forms.
        Requires one center/big/decorated grid with explicit semester headings.
        Supported case-insensitive labels are I okres, II okres, pierwszy okres,
        drugi okres, I semestr, II semestr, Okres 1 and Okres 2. Semester is 1 or 2, never inferred
        from section position or zero-based baseline values. Duplicate/unknown
        headings and records before a heading fail. Empty recognized grids can
        return no entries; unrecognized empty pages fail.
        Center-cell anchors supply inline Data civil dates and optional Rodzaj,
        Nauczyciel, Godzina lekcyjna, Czy wycieczka, Temat zajęć and Lekcja metadata.
        BR/newline or complete bold label/value blocks delimit fields. Duplicate
        fields, invalid dates/periods/booleans, untitled anchors and unknown nonempty
        center cells fail instead of partial success. Unknown raw attendance types
        are preserved, not assigned invented presence/absence classifications.
        Optional values stay unknown rather than false/zero/empty defaults.
        Approved-shaped numeric onclick detail identifiers are inert data only;
        recognized window calls allow one to four literal string/integer arguments
        after the URL, never expressions or control/whitespace characters in URLs.
        detail retrieval is a separate explicit numeric-reference operation.
        Foreign/malformed/script references never authorize transport destinations.
        Bounds: 2048 entries, 8192 metadata/script characters, 32 metadata chunks,
        1024 rendered characters/value, common HTML node/depth/byte bounds and
        shared rate/concurrency/queue/request/deadline limits. Each upstream view
        has its own account/session cache and coalescing key. Date windows use
        all-view civil dates inclusively, at most 366 days, with no per-window cache.
        Gateway frequency uses a separate collection, not HTML symbol inference.
        No locally inferred last-login date is part of this operation.
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              oneOf:
                - required: [zmiany_logowanie_wszystkie]
                - required: [zmiany_logowanie_tydzien]
                - required: [zmiany_logowanie]
              properties:
                zmiany_logowanie_wszystkie: {type: string, enum: ['']}
                zmiany_logowanie_tydzien: {type: string, enum: [zmiany_logowanie_tydzien]}
                zmiany_logowanie: {type: string, enum: [zmiany_logowanie]}
      responses:
        '200':
          $ref: '#/components/responses/Html'
        default:
          $ref: '#/components/responses/Failure'
  /przegladaj_nb/szczegoly/{id}:
    get:
      operationId: attendance_detail
      tags: [Attendance]
      summary: Read a numeric attendance detail reference
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: true
      x-evidence: independently_observed
      x-evidence-note: Original detail fixtures plus observed full-width ancillary rows; installed populated detail fields match the baseline on one context. Broader variants remain pending.
      description: |
        One container-background DIV and one detail table with line0/line1 rows,
        each containing one TH label and one TD value. Required nonempty unique
        labels; block word boundaries and empty values preserved. Full-width TD
        colspan=2 rows following fields are preserved separately as notes, never
        silently omitted or assigned invented labels. At most 32 fields/notes
        and 1024 characters per label/value. Malformed/ambiguous rows fail rather
        than being skipped. Numeric IDs only; no URL/path/query input. Read-only,
        with bounded safe expiry recovery, original budgets and isolated caches.
      parameters: [{$ref: '#/components/parameters/NumericId'}]
      security: [{SessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/Html'}
        default: {$ref: '#/components/responses/Failure'}
  /gateway/api/2.0/Attendances:
    get:
      operationId: gateway_attendance
      tags: [Attendance]
      summary: Read gateway attendance records for explicit ratio calculations
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: true
      x-evidence: independently_observed
      x-evidence-note: Original gateway fixtures. Installed overall and one-day populated subject-frequency comparison completed on one context; custom types and broader variants remain offline-only.
      description: |
        Required Attendances collection, at most 2048 records. Dates are ISO civil
        dates; semesters are explicit 1/2; type/lesson references are numeric IDs.
        Optional record Id and LessonNo remain absent when not supplied. Duplicate
        supplied record IDs, malformed references/dates and missing envelopes fail.
        Known source-informed type IDs map to absence/late/excused/exemption/present/
        excursion/contest/training; unmapped IDs are retained as unknown.
        Overall/semester ratio counts present, late and excursion over all records.
        Per-subject ratio counts present and late over present/late/absence/excused/
        exemption; known other kinds are excluded. Ratios are 0..1, unrounded, not
        percentages. Unknown types or zero denominator yield no ratio with explicit
        counts, not an invented 100 percent. Subject windows are local inclusive
        filters before bounded deduplicated lesson/subject resolution. Fresh records
        are not replaced by metadata cache hits. Safe reads share account lifecycle,
        global traffic limits, deadlines, request/body budgets and cancellation.
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Raw gateway attendance envelope
          content:
            application/json:
              schema:
                type: object
                required: [Attendances]
                properties:
                  Attendances:
                    type: array
                    maxItems: 2048
                    items:
                      type: object
                      required: [Date, Semester, Type, Lesson]
                      properties:
                        Id: {$ref: '#/components/schemas/NumericIdentifier'}
                        Date: {type: string, format: date}
                        Semester: {type: integer, enum: [1, 2]}
                        Type: {$ref: '#/components/schemas/NumericReference'}
                        Lesson: {$ref: '#/components/schemas/NumericReference'}
                        LessonNo: {type: integer, minimum: 0, maximum: 99, nullable: true}
        default: {$ref: '#/components/responses/Failure'}
  /gateway/api/2.0/Lessons/{id}:
    get:
      operationId: attendance_lesson
      tags: [Attendance]
      summary: Resolve one unique attendance lesson to a subject reference
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: true
      x-evidence: independently_observed
      x-evidence-note: Original numeric reference fixtures; installed populated one-day subject resolution independently observed under shared budgets. Complete role/layout coverage is not claimed.
      description: |
        Response Lesson.Id must match the requested numeric ID; Subject.Id is a
        required numeric reference. No arbitrary URL method or cross-login metadata.
        At most 256 unique lessons per selected frequency workload; lesson and
        subject metadata share a 256-entry account/session cache, one-hour TTL.
        Deduplication, finite request budgets and the common scheduler bound traffic.
      parameters: [{$ref: '#/components/parameters/NumericId'}]
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Raw gateway lesson envelope
          content:
            application/json:
              schema:
                type: object
                required: [Lesson]
                properties:
                  Lesson:
                    type: object
                    required: [Id, Subject]
                    properties:
                      Id: {$ref: '#/components/schemas/NumericIdentifier'}
                      Subject: {$ref: '#/components/schemas/NumericReference'}
        default: {$ref: '#/components/responses/Failure'}
  /gateway/api/2.0/Subjects/{id}:
    get:
      operationId: attendance_subject
      tags: [Attendance]
      summary: Resolve a numeric subject reference to its school-provided name
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: true
      x-evidence: independently_observed
      x-evidence-note: Original subject fixtures; installed populated one-day resolution independently observed under shared budgets. Custom types and wider roles remain unqualified.
      description: |
        Response Subject.Id must match the requested numeric ID; Name must be a
        nonblank string of at most 1024 characters. Distinct subject IDs are never
        merged by name. Metadata cache policy matches attendance_lesson; expiry,
        identity changes and cancellation remain owned by the account service.
      parameters: [{$ref: '#/components/parameters/NumericId'}]
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Raw gateway subject envelope
          content:
            application/json:
              schema:
                type: object
                required: [Subject]
                properties:
                  Subject:
                    type: object
                    required: [Id, Name]
                    properties:
                      Id: {$ref: '#/components/schemas/NumericIdentifier'}
                      Name: {type: string, minLength: 1, maxLength: 1024}
        default: {$ref: '#/components/responses/Failure'}
  /przegladaj_plan_lekcji:
    post:
      operationId: timetable
      tags: [Timetable]
      summary: Select an explicit Monday-through-Sunday timetable week
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: select_view
      x-retry-safe: false
      x-evidence: independently_observed
      x-evidence-note: Original fixtures from reviewed apix/consumer requirements and bounded two-week discovery on one context; populated installed comparison is recorded separately in VERIFICATION.md.
      description: |
        Fixed week-selection form only. A plain civil date must be a Monday with
        a representable Sunday. Selecting the view is not replayed after errors,
        expiry, cancellation or connection ambiguity. Account sessions, caches,
        coalescing keys and original shared request/deadline/body budgets apply.
        Raw HTML is not normalized domain JSON; unknown layouts must not silently
        become empty weeks. Timetable reads do not consume recent schedule events.
        Recognize exactly one decorated plan-lekcji table. Period rows are line1;
        recess rows are line0 following periods. Each period has one or two
        matching numeric TD center markers and seven timetableEntryBox cells with data-date,
        data-time_from and data-time_to attributes read by name, not attribute order.
        Dates must cover each requested civil weekday exactly once; times are
        local HH:MM values; lesson start must precede end and periods are chronological.
        Recess clocks are preserved as reported, including zero/inverted pairs;
        they are not a computed duration, inferred gap, or ordering constraint.
        At most 32 periods, 16 lesson blocks and 16 change notices per slot.
        Seven days and empty slots remain explicit. Each div.text lesson contains
        one bold subject and optional hyphen-prefixed combined teacher/classroom;
        multiple lesson blocks remain distinct. Center plan-lekcji-info notices
        retain raw labels and optional ordered tooltip label/value metadata,
        including unknown labels, rather than inferring cancellation/replacement.
        Rendered strings are bounded to 1024 characters; metadata is bounded to
        32 fields and 8192 raw characters. Missing grids, malformed/duplicate
        weekdays, unsafe repairs, nested tables, and unconsumed content fail.
        The repeated timetableEntryBox ID is permitted only in this parser; all
        other duplicate-ID parser errors remain rejected. No scripts, notice links,
        extra detail requests, or implicit school-timezone/default-week inference.
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [tydzien]
              properties:
                tydzien:
                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}_\d{4}-\d{2}-\d{2}$'
                  description: Monday and its Sunday, joined by one underscore
      responses:
        '200': {$ref: '#/components/responses/Html'}
        default: {$ref: '#/components/responses/Failure'}
  /informacja:
    get:
      operationId: student_information
      tags: [Identity]
      summary: Read HTML fields missing from gateway identity
      description: |
        Requires an unambiguous table with semantic labels for student name,
        class, register number, tutor, and school. Labels are centralized in
        config.py. Arbitrary table positions are not a supported fallback.
        A luckyNumber element can supply a number without an evidenced civil
        date; never invent today's date. Missing lucky-number markup is explicit
        unavailability. Header variants and actual live layout remain unverified.
      x-origin: synergia
      x-upstream-origin: https://synergia.librus.pl
      x-side-effect: none
      x-retry-safe: true
      x-evidence: source_informed
      x-evidence-note: Source-informed route/required fields/lucky-number marker; independently authored semantic-label fixtures, not copied layouts or live captures.
      security: [{SessionCookie: []}]
      responses:
        '200':
          $ref: '#/components/responses/Html'
        default:
          $ref: '#/components/responses/Failure'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: oauth_token
      description: Scope-preserving jar may also hold DZIENNIKSID, SDZIENNIKSID, and API DeviceCookie.
  parameters:
    NumericId:
      in: path
      name: id
      required: true
      schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[0-9]+$'}
    ClientId:
      in: query
      name: client_id
      required: true
      schema: {type: string, enum: ['46'], default: '46'}
  schemas:
    NumericIdentifier:
      oneOf:
        - {type: integer, minimum: 0}
        - {type: string, minLength: 1, maxLength: 64, pattern: '^[0-9]+$'}
    NumericReference:
      type: object
      required: [Id]
      properties:
        Id: {$ref: '#/components/schemas/NumericIdentifier'}
    Person:
      type: object
      required: [Id]
      properties:
        Id:
          oneOf:
            - {type: integer, minimum: 0}
            - {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
        FirstName: {type: string, nullable: true, maxLength: 256}
        LastName: {type: string, nullable: true, maxLength: 256}
  responses:
    Html:
      description: Raw bounded HTML, not normalized domain JSON
      content:
        text/html:
          schema: {type: string}
    Redirect:
      description: Validate origin, exact allowed path, hop count, cumulative bytes, and deadline before following
      headers:
        Location:
          schema: {type: string, maxLength: 4096}
    Failure:
      description: |
        401 session expiry; 403 scoped access denial; 429 throttle; 503 maintenance.
        No response excerpts in errors. Malformed required data is a parse failure,
        not empty success. Unknown/challenging authentication is unsupported.
