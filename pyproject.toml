[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "librus-python-api"
dynamic = ["version"]
description = "Independent bounded async Librus Synergia account, grades, and attendance client"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.14.2,<4", "loguru>=0.7.3,<1", "lxml>=6.1,<7", "pydantic>=2.12,<3", "tenacity>=9.1.2,<10", "yarl>=1.20,<2"]

[project.urls]
Repository = "https://github.com/krzysztofbury/librus-python-api"
Issues = "https://github.com/krzysztofbury/librus-python-api/issues"

[dependency-groups]
dev = [
  "mypy>=1.19,<3",
  "openapi-spec-validator>=0.7,<0.10",
  "pytest>=9,<10",
  "pyyaml>=6,<7",
  "ruff>=0.15,<0.17",
  "types-pyyaml>=6,<7",
  "types-lxml>=2026.2.16,<2027",
  "pre-commit>=4.6,<5",
  "pip-audit>=2.10,<3",
]

[tool.hatch.version]
path = "src/librus_python_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/librus_python_api"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/contracts", "/pyproject.toml", "/uv.lock", "/README.md", "/CONTRIBUTING.md", "/TODO.md", "/SECURITY.md", "/AGENTS.md", "/DESIGN.md", "/API.md", "/BENCHMARKS.md", "/CHANGELOG.md", "/REVIEW.md", "/VERIFICATION.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -ra -m 'not performance'"
markers = [
  "performance: opt-in hardware-sensitive resource measurements",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Playwright is installed ad hoc for the offline browser cross-check only.
module = ["playwright.*"]
ignore_missing_imports = true
