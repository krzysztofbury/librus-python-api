[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "librus-python-api"
dynamic = ["version"]
description = "Independent async Librus Synergia client foundations"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.12,<3"]

[project.urls]
Repository = "https://github.com/krzysztofbury/librus-python-api"
Issues = "https://github.com/krzysztofbury/librus-python-api/issues"

[dependency-groups]
dev = [
  "aiohttp>=3.13,<4",
  "mypy>=1.19,<2",
  "openapi-spec-validator>=0.7,<0.9",
  "pytest>=9,<10",
  "pyyaml>=6,<7",
  "ruff>=0.15,<0.16",
  "types-pyyaml>=6,<7",
]

[tool.hatch.version]
path = "src/librus_python_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/librus_python_api"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/contracts", "/pyproject.toml", "/uv.lock", "/README.md", "/CONTRIBUTING.md", "/TODO.md", "/SECURITY.md", "/AGENTS.md", "/DESIGN.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tools", "tests"]
