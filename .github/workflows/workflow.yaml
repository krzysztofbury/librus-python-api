name: Qualify and publish library

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Merged version tag, such as v1.0.0rc1 or v1.0.0'
        required: true
        type: string
      target:
        description: 'verify never publishes; uploads require environment approval'
        type: choice
        options: [verify, pypi]
        default: verify

permissions:
  contents: read

concurrency:
  group: library-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.identity }}
      manifest: ${{ steps.manifest.outputs.seal }}
      artifact: ${{ steps.archives.outputs.artifact-id }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the versioned source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[1-9][0-9]*)?$ ]]
          git fetch origin "refs/tags/$TAG"
          git checkout --detach "FETCH_HEAD"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Install locked tooling
        run: |
          uv python install 3.14
          uv lock --check
          uv sync --locked --python 3.14
      - name: Check remote release identity
        id: identity
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: uv run --locked python scripts/release_gate.py identity --tag "$TAG" --target "$TARGET" --output "$GITHUB_OUTPUT"
      - name: Record source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Quality and security gates
        env:
          SKIP: no-commit-to-branch
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv run --locked pre-commit run --all-files
          uv run --locked pre-commit run gitleaks-history --hook-stage manual --all-files
          uv export --quiet --locked --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/audit.txt"
          uv run --locked pip-audit --strict --disable-pip --require-hashes --requirement "$RUNNER_TEMP/audit.txt"
          uv run --locked pytest -q
      - name: Build the release archives once
        run: |
          uv build --no-sources --no-build-isolation --out-dir "$RUNNER_TEMP/build-output"
          uv run --locked python scripts/verify_artifacts.py "$RUNNER_TEMP/build-output"
          uv run --locked twine check --strict "$RUNNER_TEMP"/build-output/*
          mkdir "$RUNNER_TEMP/release-dist"
          cp "$RUNNER_TEMP"/build-output/*.whl "$RUNNER_TEMP"/build-output/*.tar.gz "$RUNNER_TEMP/release-dist/"
      - name: Seal archive bytes
        id: manifest
        env:
          TAG: ${{ inputs.tag }}
        run: uv run --locked python scripts/release_gate.py seal --tag "$TAG" --directory "$RUNNER_TEMP/release-dist" --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: archives
        with:
          name: sealed-release
          path: ${{ runner.temp }}/release-dist/
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.13', '3.14']
        dependencies: [locked, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: ${{ runner.os == 'Linux' && 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f' || (runner.arch == 'ARM64' && '743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73' || 'b0f52b0e3945b4107d89024ea38e625683011fbfc05a0d98f9fa2d6dcee28c66') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/archives
          merge-multiple: true
      - name: Check sealed bytes and test installed archives
        env:
          MANIFEST: ${{ needs.build.outputs.manifest }}
          PYTHON: ${{ matrix.python }}
          DEPENDENCIES: ${{ matrix.dependencies }}
          TMPDIR: ${{ runner.temp }}
        run: |
          uv python install "$PYTHON"
          uv run --locked python scripts/release_gate.py verify --directory "$RUNNER_TEMP/archives" --digest "$MANIFEST"
          uv run --locked python scripts/qualify_release.py "$RUNNER_TEMP/archives" --python "$PYTHON" --dependencies "$DEPENDENCIES"

  qualify-windows-disk:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
        dependencies: [locked, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/archives
          merge-multiple: true
      - name: Check sealed bytes and qualify Windows disk contracts
        env:
          MANIFEST: ${{ needs.build.outputs.manifest }}
          PYTHON: ${{ matrix.python }}
          DEPENDENCIES: ${{ matrix.dependencies }}
          TMPDIR: ${{ runner.temp }}
        run: |
          uv python install "$PYTHON"
          uv run --locked python scripts/release_gate.py verify --directory "$RUNNER_TEMP/archives" --digest "$MANIFEST"
          uv run --locked python scripts/qualify_release.py "$RUNNER_TEMP/archives" --python "$PYTHON" --dependencies "$DEPENDENCIES" --scope windows-disk

  publish:
    needs: [build, qualify, qualify-windows-disk]
    if: inputs.target != 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/librus-python-api
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/archives
          merge-multiple: true
      - name: Recheck and select only sealed distributions
        env:
          MANIFEST: ${{ needs.build.outputs.manifest }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_gate.py identity --tag "$TAG" --target pypi
          python3 scripts/release_gate.py verify --directory "$RUNNER_TEMP/archives" --digest "$MANIFEST"
          mkdir "$RUNNER_TEMP/upload"
          cp "$RUNNER_TEMP"/archives/*.whl "$RUNNER_TEMP"/archives/*.tar.gz "$RUNNER_TEMP/upload/"
      - name: Upload with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/upload/
          attestations: true

  confirm:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/archives
          merge-multiple: true
      - name: Verify PyPI hashes and fresh installation
        env:
          MANIFEST: ${{ needs.build.outputs.manifest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14
          uv run --locked python scripts/release_gate.py verify --directory "$RUNNER_TEMP/archives" --digest "$MANIFEST"
          # The JSON API updates before the installer-facing simple index.
          uv run --locked python scripts/verify_published.py --wait-index "$RUNNER_TEMP/archives"
          uv export --quiet --locked --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/check-requirements.txt"
          export ARTIFACT_ENV="$RUNNER_TEMP/pypi-check"
          uv venv "$ARTIFACT_ENV" --python 3.14
          uv pip install --python "$ARTIFACT_ENV/bin/python" --require-hashes --requirements "$RUNNER_TEMP/check-requirements.txt"
          # A CDN edge can still lag the index briefly; retry the read only.
          for attempt in 1 2 3; do
            if uv pip install --python "$ARTIFACT_ENV/bin/python" --no-cache --index-url https://pypi.org/simple "librus-python-api==$VERSION"; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          uv pip check --python "$ARTIFACT_ENV/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP"
          "$ARTIFACT_ENV/bin/python" "$GITHUB_WORKSPACE/scripts/installed_smoke.py"
