name: Permitted dependency drift

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift
  cancel-in-progress: true

jobs:
  live-check-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a completed main live check within eight days
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_live_freshness.py
  newest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Qualify newest permitted runtime dependencies offline
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
          TMPDIR: ${{ runner.temp }}
        run: |
          uv python install "$PYTHON"
          uv sync --locked --python "$PYTHON"
          uv build --no-sources --no-build-isolation --out-dir "$RUNNER_TEMP/drift-dist"
          uv run --locked python scripts/verify_artifacts.py "$RUNNER_TEMP/drift-dist"
          uv run --locked python scripts/qualify_release.py "$RUNNER_TEMP/drift-dist" --python "$PYTHON" --dependencies latest
