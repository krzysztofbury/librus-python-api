name: Permitted dependency drift

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift
  cancel-in-progress: true

jobs:
  newest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.7'
          checksum: 788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21
      - name: Qualify newest permitted runtime dependencies offline
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
          TMPDIR: ${{ runner.temp }}
        run: |
          uv python install "$PYTHON"
          uv sync --locked --python "$PYTHON"
          uv build --no-sources --no-build-isolation --out-dir "$RUNNER_TEMP/drift-dist"
          uv run --locked python scripts/verify_artifacts.py "$RUNNER_TEMP/drift-dist"
          uv run --locked python scripts/qualify_release.py "$RUNNER_TEMP/drift-dist" --python "$PYTHON" --dependencies latest
